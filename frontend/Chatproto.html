<!-- ====== CHAT SCRIPT ====== -->
<script>
  const messageBox = document.getElementById('messages');
  const userList = document.getElementById('users');
  const usersPanel = document.getElementById('usersPanel');
  const statusEl = document.getElementById('status');
  const presenceCount = document.getElementById('presenceCount');
  const userToggle = document.getElementById('userToggle');
  const form = document.getElementById('messageForm');
  const input = document.getElementById('messageInput');

  const storageKey = 'reality-chat-username';
  let username = localStorage.getItem(storageKey) || `User${Math.floor(Math.random() * 1000)}`;
  localStorage.setItem(storageKey, username);

  const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
  const socket = new WebSocket(`${protocol}${window.location.host}`);

  function escapeHtml(value) {
    return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  window.sendChatMessage = function(text, isGutCheck = true) {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      console.warn('Socket not open, cannot send message');
      return;
    }
    const message = {
      type: 'message',
      text: text,
      isGutCheck: isGutCheck,
      username: 'Gut Check'
    };
    socket.send(JSON.stringify(message));
  };

  function renderMessage(message) {
    const row = document.createElement('div');
    row.className = 'message';
    if (message.type === 'notice') {
      row.classList.add('system');
      row.innerHTML = `<div>${escapeHtml(message.text)}</div>`;
    } else {
      const time = new Date(message.ts || Date.now()).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const isGutCheck = message.isGutCheck || false;
      if (isGutCheck) {
        row.classList.add('gut-check-notice');
      }
      const displayName = message.username || 'Unknown';
      row.innerHTML = `<div><strong>${escapeHtml(displayName)}</strong><span class="time">${time}</span></div><div>${escapeHtml(message.text)}</div>`;
    }
    messageBox.appendChild(row);
    messageBox.scrollTop = messageBox.scrollHeight;
  }

  function renderUsers(users) {
    userList.innerHTML = '';
    users.forEach((name) => {
      const item = document.createElement('li');
      item.textContent = name;
      userList.appendChild(item);
    });
    presenceCount.textContent = `${users.length} online`;
  }

  userToggle.addEventListener('click', () => {
    const isVisible = usersPanel.classList.toggle('visible');
    userToggle.textContent = isVisible ? 'Hide users' : 'Show users';
  });

  socket.addEventListener('open', () => {
    statusEl.textContent = 'Connected. Joining room...';
    socket.send(JSON.stringify({ type: 'join', username }));
  });

  socket.addEventListener('message', (event) => {
    const payload = JSON.parse(event.data);
    if (payload.type === 'presence') {
      renderUsers(payload.users || []);
      statusEl.textContent = `Connected to ${payload.room}`;
      return;
    }
    if (payload.type === 'joined') {
      statusEl.textContent = `Joined as ${payload.username}`;
      return;
    }
    if (payload.type === 'message' || payload.type === 'notice') {
      renderMessage(payload);
    }
  });

  socket.addEventListener('close', () => {
    statusEl.textContent = 'Disconnected. Refresh to reconnect.';
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    socket.send(JSON.stringify({ type: 'message', text, isGutCheck: false }));
    input.value = '';
  });
</script>

    const ROUND_OPTIONS = [6, 10, 14];

    // ===== HELPERS =====
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generatePeers(centerBool) {
      const center = centerBool ? 68 : 32;
      return Array.from({ length: 5 }, () =>
        clamp(Math.round(center + (Math.random() * 50 - 25)), 0, 100)
      );
    }

    function buildPeerData(deckItems) {
      return deckItems.map((item) => ({
        truthPeers: generatePeers(item.isTrue),
        originPeers: generatePeers(item.isAIGenerated),
      }));
    }

    function brier(confidence0to100, outcomeBool) {
      const o = outcomeBool ? 1 : 0;
      const c = confidence0to100 / 100;
      return (c - o) * (c - o);
    }

    function computeRoundPoints(answer, item) {
      const truthB = brier(answer.truth, item.isTrue);
      const originB = brier(answer.origin, item.isAIGenerated);
      const truthPts = Math.round((1 - truthB) * 100);
      const originPts = Math.round((1 - originB) * 100);
      const combined = Math.round((truthPts + originPts) / 2);
      return { truthPts, originPts, combined };
    }

    function tierText(score) {
      if (score >= 80) return "Sharp calibration — your gut and your accuracy are talking to each other.";
      if (score >= 60) return "Decent instincts, with some overconfidence creeping in.";
      if (score >= 40) return "Your gut and your accuracy aren't fully in sync yet.";
      return "Time to slow down before hitting share.";
    }

    function calibrationBuckets(deck, answers, axis) {
      const bins = [
        { label: "0–33%", min: 0, max: 33 },
        { label: "34–66%", min: 34, max: 66 },
        { label: "67–100%", min: 67, max: 100 },
      ];
      return bins
        .map((bin) => {
          const rows = deck
            .map((item, i) => ({ item, answer: answers[i] }))
            .filter(({ answer }) => {
              if (!answer) return false;
              const v = axis === "truth" ? answer.truth : answer.origin;
              return v >= bin.min && v <= bin.max;
            });
          if (rows.length === 0) {
            return { bucket: bin.label, "Stated confidence": null, "Actually true": null, count: 0 };
          }
          const avgConfidence = Math.round(
            rows.reduce((s, r) => s + (axis === "truth" ? r.answer.truth : r.answer.origin), 0) /
              rows.length
          );
          const positiveCount = rows.filter((r) =>
            axis === "truth" ? r.item.isTrue : r.item.isAIGenerated
          ).length;
          const actualRate = Math.round((positiveCount / rows.length) * 100);
          return {
            bucket: bin.label,
            "Stated confidence": avgConfidence,
            "Actually true": actualRate,
            count: rows.length,
          };
        })
        .filter((b) => b.count > 0);
    }

    function GutCheckApp() {
      const [screen, setScreen] = React.useState('home');
      const [selectedCategories, setSelectedCategories] = React.useState([...CATEGORIES]);
      const [roundCount, setRoundCount] = React.useState(10);

      const [deck, setDeck] = React.useState([]);
      const [peerData, setPeerData] = React.useState([]);
      const [answers, setAnswers] = React.useState([]);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [currentAnswer, setCurrentAnswer] = React.useState({ truth: 50, origin: 50, share: null });
      const [showMyMark, setShowMyMark] = React.useState(false);

      const availableCount = React.useMemo(
        () => ITEMS.filter((it) => selectedCategories.includes(it.category)).length,
        [selectedCategories]
      );

      function toggleCategory(c) {
        setSelectedCategories((prev) =>
          prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]
        );
      }

      function handleStart() {
        const available = ITEMS.filter((it) => selectedCategories.includes(it.category));
        const size = Math.min(roundCount, available.length);
        const chosen = shuffle(available).slice(0, size);
        setDeck(chosen);
        setPeerData(buildPeerData(chosen));
        setAnswers(Array(chosen.length).fill(null));
        setCurrentIndex(0);
        setCurrentAnswer({ truth: 50, origin: 50, share: null });
        setShowMyMark(false);
        setScreen('round');
        
        if (window.sendChatMessage) {
          window.sendChatMessage('Started Gut Check: ' + chosen.length + ' rounds', true);
        }
      }

      function handleSubmitRound() {
        if (currentAnswer.share === null) return;
        const item = deck[currentIndex];
        const points = computeRoundPoints(currentAnswer, item);
        const newAnswers = [...answers];
        newAnswers[currentIndex] = { ...currentAnswer, points };
        setAnswers(newAnswers);
        setShowMyMark(false);
        setScreen('reveal');
      }

      function handleContinue() {
        if (currentIndex + 1 < deck.length) {
          setCurrentIndex(currentIndex + 1);
          setCurrentAnswer({ truth: 50, origin: 50, share: null });
          setShowMyMark(false);
          setScreen('round');
        } else {
          if (!answers[currentIndex] && currentAnswer.share !== null) {
            const points = computeRoundPoints(currentAnswer, deck[currentIndex]);
            setAnswers((prev) => {
              const next = [...prev];
              next[currentIndex] = { ...currentAnswer, points };
              return next;
            });
          }
          setScreen('summary');
          if (window.sendChatMessage) {
            const score = Math.round(
              (answers.filter(Boolean).reduce((s, a) => s + a.points.combined, 0) +
                (answers[currentIndex] ? 0 : computeRoundPoints(currentAnswer, deck[currentIndex]).combined)) /
                deck.length
            );
            window.sendChatMessage('Finished Gut Check! Score: ' + score + '/100', true);
          }
        }
      }

      function handleRestart() {
        setScreen('home');
        setDeck([]);
        setPeerData([]);
        setAnswers([]);
        setCurrentIndex(0);
      }

      const answeredSoFar = answers.filter(Boolean);
      const avgSoFar = screen === 'round' && answeredSoFar.length > 0
        ? Math.round(answeredSoFar.reduce((s, a) => s + a.points.combined, 0) / answeredSoFar.length)

          .gc-tag-false { background: rgba(226,114,91,0.15); color: var(--gc-rust); border: 1px solid rgba(226,114,91,0.4); }
          .gc-reveal-tags { display: flex; gap: 6px; margin-bottom: 10px; }

          .gc-content-card { padding: 18px; margin-bottom: 14px; }

          .gc-content-card-small { padding: 14px; margin-bottom: 12px; }

          .gc-dial { margin-bottom: 16px; }

            background: linear-gradient(90deg, var(--gc-rust) 0%, #4A5460 50%, var(--gc-teal) 100%); outline: none; cursor: pointer; }
          input.gc-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--gc-fog); border: 2px solid var(--gc-brass); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
          input.gc-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--gc-fog);
            border: 2px solid var(--gc-brass); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
          input.gc-range::-moz-range-track { height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--gc-rust) 0%, #4A5460 50%, var(--gc-teal) 100%); }

          .gc-share-block { margin: 16px 0; }

          .gc-points-row { display: flex; justify-content: space-between; margin-bottom: 14px; }

          .gc-points-value { font-size: 18px; color: var(--gc-fog); }
          .gc-points-value-total { color: var(--gc-brass); }

          .gc-gapbar { margin-bottom: 20px; }
          .gc-gapbar:last-child { margin-bottom: 2px; }
          .gc-gapbar-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gc-muted); }
          .gc-gapbar-track { position: relative; height: 6px; background: var(--gc-panel-2); border-radius: 999px; margin-top: 18px; }
          .gc-gapbar-fill { position: absolute; top: 50%; height: 3px; transform: translateY(-50%); border-radius: 2px; opacity: 0.6; }
          .gc-gapbar-mark { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; }
          .gc-gapbar-you { background: var(--gc-fog); border: 2px solid var(--gc-brass); z-index: 2; }
          .gc-gapbar-actual { background: transparent; border: 2px solid var(--gc-teal); }
          .gc-gapbar-mark span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 8px; white-space: nowrap; color: var(--gc-muted); }

          .gc-peer-track { position: relative; height: 24px; background: var(--gc-panel-2); border-radius: 999px; margin-top: 2px; }
          .gc-peer-dot { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--gc-muted); transform: translate(-50%, -50%); opacity: 0.7; }
          .gc-peer-you { background: var(--gc-brass); width: 12px; height: 12px; opacity: 1; z-index: 2; }
          .gc-peer-you span { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 8px; color: var(--gc-brass); white-space: nowrap; }

          .gc-tip-card { display: flex; gap: 8px; padding: 12px 14px; margin-bottom: 12px; color: var(--gc-muted); }
          .gc-tip-text { color: var(--gc-fog); font-size: 12px; line-height: 1.5; }
          .gc-tip-source { font-size: 10px; font-style: italic; margin-top: 4px; color: var(--gc-muted); }

          .gc-share-note { font-size: 12px; color: var(--gc-rust); background: rgba(226,114,91,0.08); border: 1px solid rgba(226,114,91,0.25); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }

          .gc-score-panel { text-align: center; padding: 22px 14px; margin-bottom: 14px; }
          .gc-score-big { font-size: 44px; color: var(--gc-brass); line-height: 1; }
          .gc-score-caption { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gc-muted); margin-top: 4px; }
          .gc-score-tier { font-size: 12px; color: var(--gc-fog); margin: 10px 0 0; }

          .gc-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
          .gc-statcard { padding: 12px 8px; text-align: center; }
          .gc-statcard-value { font-size: 18px; color: var(--gc-fog); }
          .gc-statcard-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gc-muted); margin-top: 2px; }

          .gc-muted-text { font-size: 12px; color: var(--gc-muted); line-height: 1.5; }
          .gc-chart-caption { margin: 2px 0 10px; }
          .gc-reflex-list { margin: 6px 0 0; padding-left: 16px; font-size: 12px; line-height: 1.6; color: var(--gc-fog); }

          .gc-chart-wrap { margin-top: 4px; }

          .gc-table-wrap { max-height: 200px; overflow-y: auto; margin-top: 2px; }
          .gc-table { width: 100%; border-collapse: collapse; font-size: 10px; }
          .gc-table th { text-align: left; padding: 6px 4px; color: var(--gc-muted); text-transform: uppercase; font-size: 8px; letter-spacing: 0.05em; border-bottom: 1px solid rgba(242,239,233,0.12); position: sticky; top: 0; background: var(--gc-panel); }
          .gc-table td { padding: 6px 4px; border-bottom: 1px solid rgba(242,239,233,0.06); color: var(--gc-fog); }

          .gc-fade-in { opacity: 1; }
          @media (prefers-reduced-motion: no-preference) {
            .gc-fade-in { animation: gcFadeUp 0.3s ease both; }
          }
          @keyframes gcFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        `;
        document.head.appendChild(style);
        return () => style.remove();
      }, []);

      return React.createElement('div', { className: 'gc-root' },
        screen === 'home' && React.createElement(HomeScreen, {
          selectedCategories,
          toggleCategory,
          roundCount,
          setRoundCount,
          onStart: handleStart,
          availableCount
        }),
        screen === 'round' && React.createElement(RoundScreen, {
          item: deck[currentIndex],
          index: currentIndex,
          total: deck.length,
          currentAnswer,
          setCurrentAnswer,
          onSubmit: handleSubmitRound,
          avgSoFar
        }),
        screen === 'reveal' && React.createElement(RevealScreen, {
          item: deck[currentIndex],
          answer: answers[currentIndex],
          peers: peerData[currentIndex],
          isLast: currentIndex + 1 >= deck.length,
          onContinue: handleContinue,
          showMyMark,
          setShowMyMark
        }),
        screen === 'summary' && React.createElement(SummaryScreen, {
          deck,
          answers,
          onRestart: handleRestart
        })
      );
    }

    // ===== MOUNT =====
    const mountEl = document.getElementById('gutCheckMount');
    if (mountEl) {
      try {
        console.log('Mounting Gut Check...');
        const root = ReactDOM.createRoot(mountEl);
        root.render(React.createElement(GutCheckApp));
        console.log('Gut Check mounted successfully!');
      } catch (error) {
        console.error('Error mounting:', error);
        mountEl.innerHTML = '<div style="color: #E2725B; padding: 20px; text-align: center; font-size: 12px;">Error: ' + error.message + '</div>';
      }
    }
  })();
</script>
