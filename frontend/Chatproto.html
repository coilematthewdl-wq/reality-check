<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gut Check Room</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM & Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #14181C;
      color: #F2EFE9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    .app-layout {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      width: 100%;
      align-items: flex-start;
    }

    /* CHAT ROOM */
    .chat-room {
      flex: 2;
      min-width: 350px;
      background: #1B2127;
      border: 1px solid #222933;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px 20px;
      background: #14181C;
      border-bottom: 1px solid #222933;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header h1 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; color: #F2EFE9; }
    .header .pill { background: #D4AF37; color: #14181C; padding: 6px 10px; border-radius: 999px; font-size: 12px; }
    .chat-content { display: grid; grid-template-columns: 2fr 1fr; min-height: 480px; }
    .chat-panel { display: flex; flex-direction: column; border-right: 1px solid #222933; }
    #messages { flex: 1; padding: 16px; overflow-y: auto; background: #14181C; max-height: 400px; }
    .message { margin-bottom: 12px; }
    .message strong { color: #D4AF37; }
    .message.system { color: #8B96A3; font-style: italic; }
    .message .time { font-size: 11px; color: #8B96A3; margin-left: 8px; }
    .message.gut-check-notice { 
      background: rgba(212, 175, 55, 0.12); 
      border-left: 3px solid #D4AF37; 
      padding: 6px 12px; 
      border-radius: 4px;
      color: #F2EFE9;
    }
    .composer { display: flex; gap: 10px; padding: 12px; background: #1B2127; }
    .composer input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #222933; background: #14181C; color: #F2EFE9; }
    .composer button { padding: 10px 16px; border: none; border-radius: 8px; background: #D4AF37; color: #14181C; cursor: pointer; }
    .sidebar-chat { 
      padding: 16px; 
      background: #1B2127;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 600px;
    }
    .sidebar-chat h2 { margin: 0 0 8px; font-size: 16px; color: #F2EFE9; }
    #users { 
      list-style: none; 
      padding: 0; 
      margin: 0; 
      display: flex; 
      flex-direction: column; 
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
    }
    #users li { padding: 6px 10px; border-radius: 6px; background: #222933; color: #F2EFE9; font-size: 13px; }
    .status { font-size: 12px; color: #8B96A3; }
    .sidebar-divider {
      border: none;
      border-top: 1px solid #222933;
      margin: 8px 0;
    }

    /* GUT CHECK (embedded in sidebar) */
    .gut-check-embedded {
      flex: 1;
      background: #14181C;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #222933;
      overflow-y: auto;
      max-height: 500px;
      min-height: 300px;
    }
    .gut-check-embedded::-webkit-scrollbar { width: 4px; }
    .gut-check-embedded::-webkit-scrollbar-track { background: #1b2127; border-radius: 4px; }
    .gut-check-embedded::-webkit-scrollbar-thumb { background: #3a4553; border-radius: 4px; }
    #gutCheckMount { width: 100%; }

    /* Gut Check styles (copied from your JSX) */
    .gc-root {
      --gc-ink: #14181C;
      --gc-panel: #1B2127;
      --gc-panel-2: #222933;
      --gc-brass: #D4AF37;
      --gc-teal: #3FA796;
      --gc-rust: #E2725B;
      --gc-fog: #F2EFE9;
      --gc-muted: #8B96A3;
      background: var(--gc-ink);
      color: var(--gc-fog);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 0;
      border-radius: 12px;
      max-width: 100%;
      margin: 0 auto;
    }
    .gc-root *, .gc-root *::before, .gc-root *::after { box-sizing: border-box; }
    .gc-display { font-family: 'Space Grotesk', 'Arial Narrow', sans-serif; }
    .gc-mono { font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace; }
    .gc-brand { display: flex; align-items: center; gap: 8px; color: var(--gc-brass); }
    .gc-brand-title { font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
    .gc-lede { color: var(--gc-muted); font-size: 12px; line-height: 1.5; margin: 8px 0 14px; }
    .gc-panel { background: var(--gc-panel); border: 1px solid rgba(242,239,233,0.08); border-radius: 12px; }
    .gc-section { padding: 12px; margin-bottom: 10px; }
    .gc-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gc-muted); margin-bottom: 8px; }
    .gc-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .gc-chip {
      padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(242,239,233,0.18);
      font-size: 11px; cursor: pointer; color: var(--gc-muted); background: transparent;
      transition: all 0.15s ease; font-family: 'Inter', sans-serif;
    }
    .gc-chip:hover { border-color: rgba(242,239,233,0.4); color: var(--gc-fog); }
    .gc-chip.active { border-color: var(--gc-brass); color: var(--gc-brass); background: rgba(212,175,55,0.08); }
    .gc-btn {
      padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 12px;
      cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px;
      transition: opacity 0.15s ease; font-family: 'Inter', sans-serif;
    }
    .gc-btn-primary { background: var(--gc-brass); color: var(--gc-ink); }
    .gc-btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }
    .gc-btn-primary:hover:not([disabled]) { opacity: 0.88; }
    .gc-btn-ghost { background: transparent; color: var(--gc-fog); border: 1px solid rgba(242,239,233,0.22); }
    .gc-start-btn { width: 100%; justify-content: center; margin-top: 4px; }
    .gc-content-card { padding: 14px; margin-bottom: 12px; }
    .gc-content-card p { font-size: 14px; line-height: 1.5; margin: 0; }
    .gc-content-card-small { padding: 10px; margin-bottom: 8px; }
    .gc-content-card-small p { font-size: 12px; color: var(--gc-muted); }
    .gc-dial { margin-bottom: 14px; }
    .gc-dial-title { font-size: 11px; font-weight: 600; margin-bottom: 6px; }
    .gc-dial-labels { display: flex; justify-content: space-between; align-items: center; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gc-muted); margin-bottom: 4px; }
    .gc-dial-readout { color: var(--gc-fog); font-size: 11px; background: var(--gc-panel-2); padding: 2px 8px; border-radius: 999px; }
    input.gc-range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px;
      background: linear-gradient(90deg, var(--gc-rust) 0%, #4A5460 50%, var(--gc-teal) 100%); outline: none; cursor: pointer; }
    input.gc-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--gc-fog); border: 3px solid var(--gc-brass); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .gc-tag {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px;
      font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .gc-cat-tag { background: rgba(242,239,233,0.06); color: var(--gc-muted); margin-bottom: 8px; }
    .gc-tag-true { background: rgba(63,167,150,0.15); color: var(--gc-teal); border: 1px solid rgba(63,167,150,0.4); }
    .gc-tag-false { background: rgba(226,114,91,0.15); color: var(--gc-rust); border: 1px solid rgba(226,114,91,0.4); }
    .gc-reveal-tags { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .gc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .gc-eyebrow { font-size: 10px; letter-spacing: 0.08em; color: var(--gc-muted); }
    .gc-topbar-score { color: var(--gc-brass); }
    .gc-points-row { display: flex; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
    .gc-points-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gc-muted); }
    .gc-points-value { font-size: 16px; color: var(--gc-fog); }
    .gc-points-value-total { color: var(--gc-brass); }
    .gc-gapbar { margin-bottom: 16px; }
    .gc-gapbar-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gc-muted); }
    .gc-gapbar-track { position: relative; height: 6px; background: var(--gc-panel-2); border-radius: 999px; margin-top: 16px; }
    .gc-gapbar-fill { position: absolute; top: 50%; height: 3px; transform: translateY(-50%); border-radius: 2px; opacity: 0.6; }
    .gc-gapbar-mark { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; }
    .gc-gapbar-you { background: var(--gc-fog); border: 2px solid var(--gc-brass); z-index: 2; }
    .gc-gapbar-actual { background: transparent; border: 2px solid var(--gc-teal); }
    .gc-gapbar-mark span { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 8px; white-space: nowrap; color: var(--gc-muted); }
    .gc-peer-track { position: relative; height: 24px; background: var(--gc-panel-2); border-radius: 999px; margin-top: 4px; }
    .gc-peer-dot { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--gc-muted); transform: translate(-50%, -50%); opacity: 0.7; }
    .gc-peer-you { background: var(--gc-brass); width: 11px; height: 11px; opacity: 1; z-index: 2; }
    .gc-peer-you span { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 8px; color: var(--gc-brass); }
    .gc-tip-card { display: flex; gap: 8px; padding: 10px 12px; margin-bottom: 10px; color: var(--gc-muted); }
    .gc-tip-text { color: var(--gc-fog); font-size: 11px; line-height: 1.4; }
    .gc-tip-source { font-size: 10px; font-style: italic; margin-top: 4px; color: var(--gc-muted); }
    .gc-share-block { margin: 12px 0; }
    .gc-share-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .gc-share-active-yes { border-color: var(--gc-teal); color: var(--gc-teal); }
    .gc-share-active-no { border-color: var(--gc-rust); color: var(--gc-rust); }
    .gc-share-note { font-size: 11px; color: var(--gc-rust); background: rgba(226,114,91,0.08); border: 1px solid rgba(226,114,91,0.25); border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }
    .gc-score-panel { text-align: center; padding: 16px 12px; margin-bottom: 12px; }
    .gc-score-big { font-size: 36px; color: var(--gc-brass); line-height: 1; }
    .gc-score-caption { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gc-muted); margin-top: 4px; }
    .gc-score-tier { font-size: 11px; color: var(--gc-fog); margin: 8px 0 0; }
    .gc-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .gc-statcard { padding: 10px 6px; text-align: center; }
    .gc-statcard-value { font-size: 18px; color: var(--gc-fog); }
    .gc-statcard-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gc-muted); margin-top: 2px; }
    .gc-muted-text { font-size: 11px; color: var(--gc-muted); line-height: 1.4; }
    .gc-reflex-list { margin: 6px 0 0; padding-left: 16px; font-size: 11px; line-height: 1.6; color: var(--gc-fog); }
    .gc-chart-wrap { margin-top: 4px; height: 160px; }
    .gc-table-wrap { max-height: 140px; overflow-y: auto; margin-top: 4px; }
    .gc-table { width: 100%; border-collapse: collapse; font-size: 10px; }
    .gc-table th { text-align: left; padding: 4px 4px; color: var(--gc-muted); text-transform: uppercase; font-size: 8px; letter-spacing: 0.05em; border-bottom: 1px solid rgba(242,239,233,0.12); position: sticky; top: 0; background: var(--gc-panel); }
    .gc-table td { padding: 4px 4px; border-bottom: 1px solid rgba(242,239,233,0.06); color: var(--gc-fog); }
    .gc-fade-in { opacity: 1; }
    .gc-warn { margin-top: 8px; font-size: 11px; color: var(--gc-rust); }
    .gc-details { margin-top: 12px; font-size: 11px; color: var(--gc-muted); }
    .gc-details summary { cursor: pointer; color: var(--gc-fog); }
    .gc-details ul { margin: 6px 0 0; padding-left: 16px; line-height: 1.5; }
    .gc-link-btn { background: none; border: none; color: var(--gc-brass); font-size: 10px; cursor: pointer; padding: 0; }
    .gc-link-btn:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: no-preference) {
      .gc-fade-in { animation: gcFadeUp 0.3s ease both; }
    }
    @keyframes gcFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 760px) { .chat-content { grid-template-columns: 1fr; } .chat-panel { border-right: none; border-bottom: 1px solid #374151; } }
    @media (max-width: 1024px) { .app-layout { flex-direction: column; } }
  </style>
</head>
<body>

<div class="app-layout">
  <!-- CHAT ROOM -->
  <div class="chat-room">
    <div class="header">
      <h1>Gut Check Room</h1>
      <span class="pill" id="presenceCount">0 online</span>
    </div>
    <div class="chat-content">
      <div class="chat-panel">
        <div id="messages"></div>
        <form class="composer" id="messageForm">
          <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
      <aside class="sidebar-chat">
        <!-- Online users -->
        <div>
          <h2>Online now</h2>
          <ul id="users"></ul>
          <div class="status" id="status">Connecting...</div>
        </div>
        
        <hr class="sidebar-divider" />
        
        <!-- GUT CHECK EMBEDDED -->
        <div class="gut-check-embedded">
          <div id="gutCheckMount"></div>
        </div>
      </aside>
    </div>
  </div>
</div>

<!-- ====== CHAT SCRIPT ====== -->
<script>
  const messageBox = document.getElementById('messages');
  const userList = document.getElementById('users');
  const statusEl = document.getElementById('status');
  const presenceCount = document.getElementById('presenceCount');
  const form = document.getElementById('messageForm');
  const input = document.getElementById('messageInput');

  const storageKey = 'reality-chat-username';
  let username = localStorage.getItem(storageKey) || `User${Math.floor(Math.random() * 1000)}`;
  localStorage.setItem(storageKey, username);

  const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
  const socket = new WebSocket(`${protocol}${window.location.host}`);

  function escapeHtml(value) {
    return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Global function for Gut Check to send messages
  window.sendChatMessage = function(text, isGutCheck = true) {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      console.warn('Socket not open, cannot send message');
      return;
    }
    const message = {
      type: 'message',
      text: text,
      isGutCheck: isGutCheck,
      username: 'Gut Check'
    };
    socket.send(JSON.stringify(message));
  };

  function renderMessage(message) {
    const row = document.createElement('div');
    row.className = 'message';
    if (message.type === 'notice') {
      row.classList.add('system');
      row.innerHTML = `<div>${escapeHtml(message.text)}</div>`;
    } else {
      const time = new Date(message.ts || Date.now()).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const isGutCheck = message.isGutCheck || false;
      if (isGutCheck) {
        row.classList.add('gut-check-notice');
      }
      const displayName = message.username || 'Unknown';
      row.innerHTML = `<div><strong>${escapeHtml(displayName)}</strong><span class="time">${time}</span></div><div>${escapeHtml(message.text)}</div>`;
    }
    messageBox.appendChild(row);
    messageBox.scrollTop = messageBox.scrollHeight;
  }

  function renderUsers(users) {
    userList.innerHTML = '';
    users.forEach((name) => {
      const item = document.createElement('li');
      item.textContent = name;
      userList.appendChild(item);
    });
    presenceCount.textContent = `${users.length} online`;
  }

  socket.addEventListener('open', () => {
    statusEl.textContent = 'Connected. Joining room...';
    socket.send(JSON.stringify({ type: 'join', username }));
  });

  socket.addEventListener('message', (event) => {
    const payload = JSON.parse(event.data);
    if (payload.type === 'presence') {
      renderUsers(payload.users || []);
      statusEl.textContent = `Connected to ${payload.room}`;
      return;
    }
    if (payload.type === 'joined') {
      statusEl.textContent = `Joined as ${payload.username}`;
      return;
    }
    if (payload.type === 'message' || payload.type === 'notice') {
      renderMessage(payload);
    }
  });

  socket.addEventListener('close', () => {
    statusEl.textContent = 'Disconnected. Refresh to reconnect.';
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    socket.send(JSON.stringify({ type: 'message', text, isGutCheck: false }));
    input.value = '';
  });
</script>

<!-- ====== GUT CHECK - LOAD JSX DIRECTLY (with Babel) ====== -->
<script type="text/babel" src="gut-check.jsx"></script>

</body>
</html>
