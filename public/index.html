<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  body { 
    background: #14181C; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    color: #F2EFE9;
  }
  
  .login-card {
    width: 400px;
    background: #1B2127;
    border-radius: 16px;
    border: 1px solid #222933;
    padding: 40px 32px;
    color: #F2EFE9;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  
  .logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #D4AF37;
  }
  
  .subtitle {
    text-align: center;
    color: #8B96A3;
    font-size: 14px;
    margin-bottom: 32px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    display: block;
    font-size: 14px;
    color: #8B96A3;
    margin-bottom: 6px;
  }
  
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #222933;
    background: #14181C;
    color: #F2EFE9;
    font-size: 16px;
    outline: none;
    transition: 0.2s;
  }
  
  .form-group input:focus {
    border-color: #D4AF37;
  }
  
  .login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #D4AF37;
    color: #14181C;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 8px;
  }
  
  .login-btn:hover {
    background: #c49c31;
  }
  
  .error-msg {
    background: rgba(226,114,91,0.16);
    color: #E2725B;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    text-align: center;
    display: none;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">Gut Check</div>
  <div class="subtitle">Pick a nickname and enter the room</div>
  
  <div class="error-msg" id="errorMsg">Please enter a nickname</div>
  
  <form id="nicknameForm" onsubmit="handleNickname(event)">
    <div class="form-group">
      <label>Nickname</label>
      <input type="text" id="nickname" placeholder="Enter your nickname" required>
    </div>
    
    <button type="submit" class="login-btn">Enter Room</button>
  </form>
</div>

<script>
  function handleNickname(e) {
    e.preventDefault();

    const nickname = document.getElementById('nickname').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (nickname === '') {
      errorMsg.textContent = 'Please enter a nickname';
      errorMsg.style.display = 'block';
      return;
    }

    errorMsg.style.display = 'none';
    localStorage.setItem('reality-chat-username', nickname);
    window.location.href = 'Chatproto.html';
  }
</script>

</body>
</html>
